<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste</title>
<link rel="stylesheet" href="teste001.css">
<script src="teste001.js" defer></script>
</head>
<body>    
    <div id = "main">
        <h2 id="error"></h2>
        <div id="calculator">
                <input id="result" placeholder="result" disabled></input>
                <div id="buttons">
                <div id="inputs">
                    <button id="clear">C</button>
                    <button id="parentesis">()</button>
                    <button id="percentage">%</button>
                    <br>
                    <button id="one">1</button>
                    <button id="two">2</button>
                    <button id="three">3</button>
                    <br>
                    <button id="four">4</button>
                    <button id="five">5</button>
                    <button id="six">6</button>
                    <br>
                    <button id="seven">7</button>
                    <button id="eighth">8</button>
                    <button id="nine">9</button>
                    <br>
                    <button id="negate">+/-</button>
                    <button id="zero">0</button>
                    <button id="decimal">.</button>
                </div>
                <div id="operators">
                    <button id="add">+</button>
                    <br>
                    <button id="subtract">-</button>
                    <br>
                    <button id="multiply">*</button>
                    <br>
                    <button id="divide">/</button>
                    <br>
                    <button id="back">⌫</button>
                </div>
            </div>
            <button id="equals">=</button>
        </div>
    </div>
</body>
</html>
